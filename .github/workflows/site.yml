name: Sitio — build y verificación

# La verificación corre en cada push y en cada PR. Que la Definition of Done sea
# automática es lo que impide que se negocie a la baja bajo presión de fecha.
on:
  push:
    branches: [main, 'claude/**']
    paths: ['site/**', 'scripts/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'scripts/**']

# ── UNA SOLA FUENTE DE VERDAD (R-27) ─────────────────────────────────────────
# Este workflow NO comprueba nada por su cuenta. Antes tenía sus propias
# guardias de la Definition of Done escritas a mano aquí dentro, en paralelo a
# las de `scripts/verificar-todo.sh`, y las dos listas divergieron sin que nadie
# lo notara: el CI exigía `description`, `canonical`, `hreflang` y `width/height`
# que en local no se miraban. Se descubrió cuando el CI se desbloqueó tras seis
# commits sin desplegar y falló en guardias que en la máquina de Abraham
# llevaban meses en verde (L-087, L-088).
#
# Ahora sólo hay un guardián, y correrlo en local es literalmente correr el CI:
#
#     ./scripts/verificar-todo.sh
#
# Añadir una comprobación se hace en ese script, y este workflow la hereda.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: site/package-lock.json }

      # `npm ci` y no `npm install`: es el instalador estricto, el que exige que
      # `package-lock.json` cuadre exactamente con `package.json`. Es también el
      # que usa Cloudflare Pages, y por eso es el que vale.
      - name: Instalar
        working-directory: site
        run: npm ci

      # Tipos, pruebas, build, accesibilidad, auditoría, 301, estilos, guardias
      # de la DoD… todo. La lista vive en el script, no aquí.
      #
      # SALVO el lockfile: esa comprobación levanta un contenedor Docker para
      # reproducir la instalación de Linux, y aquí ya ESTAMOS en Linux — el
      # `npm ci` de arriba es la prueba real y directa. Si el lockfile estuviera
      # desincronizado, este job ya habría muerto en el paso anterior.
      - name: Verificación completa
        env: { SALTAR_LOCKFILE: '1' }
        run: bash scripts/verificar-todo.sh

      # Se audita sobre una COPIA: el auditor escribe informe.md y datos.json en la
      # carpeta que analiza, y dist es el artefacto que se despliega. Auditar en
      # sitio publicaría el informe interno junto al sitio.
      - name: Informe de auditoría del build
        run: |
          cp -r site/dist "$RUNNER_TEMP/dist-auditoria"
          node scripts/audit-mirror.mjs "$RUNNER_TEMP/dist-auditoria"
          cat "$RUNNER_TEMP/dist-auditoria/informe.md" >> $GITHUB_STEP_SUMMARY
